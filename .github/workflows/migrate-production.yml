name: Run Convex Migration (production)

# 수동 실행 전용. push/merge로는 절대 트리거되지 않는다 —
# wipeDemoData 같은 파괴적 마이그레이션이 배포마다 자동 실행되면 안 되기 때문이다.
# 운영자가 Actions 탭에서 마이그레이션을 직접 골라 1회씩 실행한다.
on:
  workflow_dispatch:
    inputs:
      migration:
        description: '실행할 마이그레이션 (convex/migrations.ts)'
        type: choice
        required: true
        default: backfillSearchText
        options:
          - bootstrapAdmin
          - promoteAdmin
          - normalizeCohorts
          - backfillSearchText
          - rebuildRollups
          - wipeDemoData
      args:
        description: 'JSON 인자 — bootstrapAdmin: {"name":"홍길동","phone":"01012345678"} / promoteAdmin: {"phone":"01012345678"} / 그 외는 비움'
        type: string
        required: false
        default: ''
      confirm:
        description: '확인값 — wipeDemoData=WIPE, rebuildRollups=REBUILD 를 직접 입력 (그 외는 비움)'
        type: string
        required: false
        default: ''

# Required secrets (configure in GitHub repo Settings > Secrets and variables > Actions):
#   CONVEX_DEPLOY_KEY   - Convex production deploy key (deploy.yml과 동일한 시크릿)

# deploy.yml과 같은 concurrency 그룹 — 배포와 마이그레이션이 동시에 돌지 않는다.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      # 설치보다 먼저 입력을 검증해 잘못된 실행을 즉시 끊는다.
      - name: Validate migration input
        env:
          MIGRATION: ${{ inputs.migration }}
          MIGRATION_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          case "$MIGRATION" in
            wipeDemoData) required=WIPE ;;
            rebuildRollups) required=REBUILD ;;
            *) required='' ;;
          esac
          if [ -n "$required" ] && [ "$MIGRATION_CONFIRM" != "$required" ]; then
            echo "::error::${MIGRATION} 실행에는 confirm 입력값이 정확히 '${required}' 여야 합니다."
            exit 1
          fi
          if [ -z "$required" ] && [ -n "$MIGRATION_CONFIRM" ]; then
            echo "::error::${MIGRATION} 은 confirm 인자를 받지 않습니다. confirm 입력을 비우세요."
            exit 1
          fi
          echo "실행 대상: migrations:${MIGRATION}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # CONVEX_DEPLOY_KEY가 프로덕션 배포를 가리키므로 --prod 플래그는 불필요하다
      # (같이 주면 CLI가 무시한다는 경고만 출력한다).
      - name: Run migration on production Convex
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          MIGRATION: ${{ inputs.migration }}
          MIGRATION_ARGS: ${{ inputs.args }}
          MIGRATION_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          # 셸 문자열로 JSON을 조립하지 않고 파서로 병합한다(따옴표 깨짐 방지).
          args_json="$(node -e '
            const raw = (process.env.MIGRATION_ARGS || "").trim()
            const args = raw ? JSON.parse(raw) : {}
            if (typeof args !== "object" || args === null || Array.isArray(args)) {
              throw new Error("args 는 JSON 객체여야 합니다.")
            }
            const confirm = (process.env.MIGRATION_CONFIRM || "").trim()
            if (confirm) args.confirm = confirm
            process.stdout.write(JSON.stringify(args))
          ')"
          npx convex run "migrations:$MIGRATION" "$args_json"
          # backfillSearchText / rebuildRollups는 스케줄러로 배치를 이어 달리므로 CLI는 첫 배치 후 끝난다.
          echo "::notice::backfillSearchText / rebuildRollups 는 스케줄러로 배치를 이어 실행합니다. Convex 대시보드 Logs에서 마지막 단계(done: true)를 확인하세요."

name: Deploy Production

on:
  push:
    branches: [main]
  # 수동 실행: 최초 오픈 배포, 실패한 배포 재시도, 커밋 없이 재배포할 때 사용
  workflow_dispatch:

# Required secrets (configure in GitHub repo Settings > Secrets and variables > Actions):
#   VERCEL_TOKEN        - Vercel personal access token
#   VERCEL_ORG_ID       - Vercel team/org ID
#   VERCEL_PROJECT_ID   - Vercel project ID
#   CONVEX_DEPLOY_KEY   - Convex production deploy key

# 프로덕션 배포는 절대 동시에 돌지 않는다. 진행 중인 배포는 취소하지 않고(백엔드만
# 올라간 반쪽 상태를 만들지 않기 위해) 큐에 넣어 순서대로 실행한다.
# migrate-production.yml도 같은 그룹을 써서 배포와 마이그레이션이 겹치지 않는다.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 백엔드 먼저. 이 브랜치에서 쿼리 시그니처가 바뀌었으므로 프론트보다 반드시 선행.
      # -y: 확인 프롬프트를 건너뛴다 (CI가 입력을 기다리며 멈추지 않게).
      - name: Deploy Convex functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy -y

      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          npx vercel build --prod --token=$VERCEL_TOKEN
          npx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

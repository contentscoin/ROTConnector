name: Deploy Production

on:
  push:
    branches: [main]
  # 수동 실행: 최초 오픈 배포, 실패한 배포 재시도, 커밋 없이 재배포할 때 사용
  workflow_dispatch:

# Required secrets (configure in GitHub repo Settings > Secrets and variables > Actions):
#   CONVEX_DEPLOY_KEY   - Convex production deploy key
#   VERCEL_TOKEN        - Vercel personal access token (해당 스코프 접근 권한 필요)
#
# VERCEL_ORG_ID / VERCEL_PROJECT_ID 시크릿은 더 이상 쓰지 않는다.
# 손으로 옮겨 적어야 하는 불투명한 ID 대신, 사람이 읽고 검증할 수 있는
# "프로젝트 이름 + 스코프 슬러그"(아래 env)로 프로젝트를 연결한다.

# 프로덕션 배포는 절대 동시에 돌지 않는다. 진행 중인 배포는 취소하지 않고(백엔드만
# 올라간 반쪽 상태를 만들지 않기 위해) 큐에 넣어 순서대로 실행한다.
# migrate-production.yml도 같은 그룹을 써서 배포와 마이그레이션이 겹치지 않는다.
concurrency:
  group: production-deploy
  cancel-in-progress: false

# 시크릿이 아니다 — 값이 틀렸으면 시크릿을 건드리지 말고 이 파일에서 바로 고친다.
#   VERCEL_PROJECT_NAME : Vercel 프로젝트 이름 (대시보드 프로젝트 URL 마지막 조각)
#   VERCEL_SCOPE_SLUG   : (선택) Vercel 스코프 슬러그. **2차 시도에서만 쓰는 폴백 값**이다.
#                         개인(hobby) 토큰은 기본 스코프가 개인 계정이라 --scope 가 필요 없어서
#                         1차 시도는 항상 --scope 없이 돈다. 비워 두면 폴백을 건너뛴다.
#                         값이 틀려도 1차 시도가 성공하면 배포는 깨지지 않는다.
#   VERCEL_CLI_VERSION  : CLI 버전 고정 (npx가 매번 최신을 끌어와 동작이 바뀌는 것을 방지)
# 확인 방법: 아래 `Diagnose Vercel access` 단계가 성공·실패와 무관하게 매 실행마다
#   `vercel whoami` / `teams ls` / `project ls` 결과를 로그에 출력한다.
env:
  VERCEL_PROJECT_NAME: rotconnector
  VERCEL_SCOPE_SLUG: jakes-projects-0ab50f91
  VERCEL_CLI_VERSION: 58.4.4

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 백엔드 먼저. 이 브랜치에서 쿼리 시그니처가 바뀌었으므로 프론트보다 반드시 선행.
      # -y: 확인 프롬프트를 건너뛴다 (CI가 입력을 기다리며 멈추지 않게).
      - name: Deploy Convex functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy -y

      # 배포 "전에", 성공·실패와 무관하게 항상 실행한다. 예전에는 실패 시에만 돌렸는데
      # 그러면 로그를 사람이 옮겨 붙여 줄 때까지 아무것도 알 수 없었다. 이제 모든 실행의
      # 로그에 토큰이 실제로 볼 수 있는 계정·스코프·프로젝트 목록이 남는다.
      # 진단은 배포를 막지 않는다 — 각 명령에 `|| true` 를 붙여 실패해도 넘어간다.
      # 출력되는 계정 이름/팀 슬러그/프로젝트 이름은 시크릿이 아니다.
      # 시크릿 값 자체는 절대 출력하지 않는다(환경 전체 덤프 금지 — printenv/env/set 금지).
      - name: Diagnose Vercel access
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vc="npx --yes vercel@${VERCEL_CLI_VERSION}"
          echo "설정값: project=${VERCEL_PROJECT_NAME} scope=${VERCEL_SCOPE_SLUG:-<비어 있음 → 폴백 없음>} cli=${VERCEL_CLI_VERSION}"
          echo "::group::vercel whoami (토큰이 속한 계정)"
          $vc whoami --token="$VERCEL_TOKEN" || true
          echo "::endgroup::"
          echo "::group::vercel teams ls (토큰이 접근 가능한 팀 스코프 슬러그 목록 / 개인 계정은 비어 있을 수 있음)"
          $vc teams ls --token="$VERCEL_TOKEN" || true
          echo "::endgroup::"
          echo "::group::vercel project ls (토큰 기본 스코프 = 개인 계정의 프로젝트 이름 목록)"
          $vc project ls --token="$VERCEL_TOKEN" || true
          echo "::endgroup::"
          if [ -n "${VERCEL_SCOPE_SLUG:-}" ]; then
            echo "::group::vercel project ls --scope ${VERCEL_SCOPE_SLUG} (폴백 스코프의 프로젝트 이름 목록)"
            $vc project ls --scope "$VERCEL_SCOPE_SLUG" --token="$VERCEL_TOKEN" || true
            echo "::endgroup::"
          fi
          echo "::notice::위 project ls 목록에 있는 이름을 deploy.yml 의 VERCEL_PROJECT_NAME 에 그대로 넣으세요. 기본 스코프 목록에 프로젝트가 보이면 VERCEL_SCOPE_SLUG 는 비워도 됩니다. 목록이 전부 비었거나 토큰 오류가 나면 VERCEL_TOKEN 시크릿을 재발급해야 합니다."

      # `vercel link`으로 이름 기반 연결을 만든다. CLI가 .vercel/project.json을
      # 직접 써 주므로 ID를 손으로 조립하지 않는다.
      # 주의: VERCEL_ORG_ID / VERCEL_PROJECT_ID 환경변수를 이 단계에 넣으면 CLI가
      # 이름 기반 링크보다 그 값을 우선하므로 절대 넣지 않는다.
      #
      # 2단계 시도: 개인(hobby) 토큰은 기본 스코프가 개인 계정이라 `--scope` 가 필요 없다.
      # 틀린 슬러그를 넘기는 것이 지금까지의 실패 원인으로 가장 의심되므로
      #   1차: --scope 없이 (토큰 기본 스코프)
      #   2차: --scope <VERCEL_SCOPE_SLUG> (슬러그가 설정돼 있을 때만)
      # 둘 다 실패하면 이 단계는 그대로 실패한다(deploy 자체에 `|| true` 를 붙이지 않는다).
      # `--team`은 58.x에서 deprecated 경고가 나므로 `--scope`를 쓴다.
      - name: Deploy to Vercel (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          vc="npx --yes vercel@${VERCEL_CLI_VERSION}"

          # link → pull → build → deploy 한 묶음. 인자로 받은 스코프 플래그("--scope <슬러그>"
          # 또는 아무것도 없음)를 모든 하위 명령에 그대로 붙인다.
          # `if run_deploy` 안에서는 set -e 가 꺼지므로 각 명령에 `|| return 1` 을 명시해
          # 앞 단계가 실패하면 뒤 단계를 실행하지 않게 한다.
          run_deploy() {
            # 이전 시도가 남긴 링크·빌드 산출물을 지운다(.vercel 은 gitignore 대상).
            rm -rf .vercel
            $vc link --yes --project "$VERCEL_PROJECT_NAME" "$@" --token="$VERCEL_TOKEN" || return 1
            $vc pull --yes --environment=production "$@" --token="$VERCEL_TOKEN" || return 1
            $vc build --prod "$@" --token="$VERCEL_TOKEN" || return 1
            # deploy 는 비대화형에서 --yes 가 없으면 "requires confirmation" 으로 죽는다.
            $vc deploy --prebuilt --prod --yes "$@" --token="$VERCEL_TOKEN" || return 1
          }

          echo "::group::1차 시도 — 토큰 기본 스코프 (--scope 없음)"
          if run_deploy; then
            echo "::endgroup::"
            echo "배포 성공: 토큰 기본 스코프, 프로젝트 ${VERCEL_PROJECT_NAME}"
            exit 0
          fi
          echo "::endgroup::"
          echo "::warning::기본 스코프로 배포하지 못했습니다. VERCEL_SCOPE_SLUG 폴백을 시도합니다."

          if [ -z "${VERCEL_SCOPE_SLUG:-}" ]; then
            echo "::error::기본 스코프 배포가 실패했고 VERCEL_SCOPE_SLUG 가 비어 있어 재시도할 대상이 없습니다. 위 'Diagnose Vercel access' 단계의 project ls / teams ls 출력과 대조해 deploy.yml 의 VERCEL_PROJECT_NAME (필요하면 VERCEL_SCOPE_SLUG) 를 고치세요."
            exit 1
          fi

          echo "::group::2차 시도 — 명시적 스코프 ${VERCEL_SCOPE_SLUG}"
          if run_deploy --scope "$VERCEL_SCOPE_SLUG"; then
            echo "::endgroup::"
            echo "배포 성공: 스코프 ${VERCEL_SCOPE_SLUG}, 프로젝트 ${VERCEL_PROJECT_NAME}"
            exit 0
          fi
          echo "::endgroup::"
          echo "::error::기본 스코프와 스코프 ${VERCEL_SCOPE_SLUG} 둘 다 배포에 실패했습니다. 위 'Diagnose Vercel access' 단계 출력에서 실제 계정·스코프 슬러그·프로젝트 이름을 확인해 deploy.yml 상단 env 를 고치세요(시크릿은 건드릴 필요 없음). 목록이 전부 비어 있으면 VERCEL_TOKEN 을 재발급하세요."
          exit 1

name: Deploy Production (backend / Convex)

on:
  push:
    branches: [main]
  # 수동 실행: 최초 오픈 배포, 실패한 배포 재시도, 커밋 없이 재배포할 때 사용.
  # 쿼리 시그니처가 바뀌는 릴리스에서는 프론트 커밋을 push 하기 전에 여기서 먼저 백엔드를 올린다.
  workflow_dispatch:

# Required secrets (configure in GitHub repo Settings > Secrets and variables > Actions):
#   CONVEX_DEPLOY_KEY   - Convex production deploy key (이 워크플로우가 쓰는 유일한 시크릿)
#
# 프론트엔드(Vercel)는 이 워크플로우가 배포하지 않는다. Vercel 대시보드의 GitHub git 연동이
# `main` push마다 스스로 빌드·배포한다(DEPLOY.md §0-1). 따라서 VERCEL_TOKEN /
# VERCEL_ORG_ID / VERCEL_PROJECT_ID 시크릿은 더 이상 쓰지 않으며 저장소에서 지워도 된다.

# 프로덕션 배포는 절대 동시에 돌지 않는다. 진행 중인 배포는 취소하지 않고 큐에 넣어
# 순서대로 실행한다. migrate-production.yml도 같은 그룹을 써서
# Convex 배포와 마이그레이션이 겹치지 않는다.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # -y: 확인 프롬프트를 건너뛴다 (CI가 입력을 기다리며 멈추지 않게).
      - name: Deploy Convex functions
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy -y

<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1e3a5f" />
    <meta
      name="description"
      content="알비연 링크 — ROTC 비즈니스연합회 회원의 도움요청·사업소개·행사·후원·협업을 한곳에. 선후배의 신뢰를 비즈니스 연결로."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="알비연 링크" />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="알비연 링크 - 선후배의 신뢰를 비즈니스 연결로"
    />
    <meta
      property="og:description"
      content="ROTC 비즈니스연합회 회원 간 도움요청, 사업소개, 행사, 후원, 협업을 연결하는 신뢰 기반 플랫폼"
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="알비연 링크" />

    <title>알비연 링크</title>

    <!-- Splash screen styles (removed once React mounts) -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        z-index: 9999;
        gap: 12px;
        transition: opacity 0.3s ease;
      }
      #splash .logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: #1e3a5f;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #d4a853;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: -0.5px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #splash .name {
        font-size: 16px;
        font-weight: 700;
        color: #1e3a5f;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #splash .spinner {
        width: 24px;
        height: 24px;
        border: 3px solid #e2e8f0;
        border-top-color: #1e3a5f;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 8px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen: visible until React mounts -->
    <div id="splash" aria-hidden="true">
      <div class="logo">ROT</div>
      <div class="name">알비연 링크</div>
      <div class="spinner"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
